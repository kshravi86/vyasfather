name: iOS Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      SWISS_LIB_DIR: ${{ github.workspace }}/ThirdParty/SwissEph/lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Swiss Ephemeris archive
        run: |
          chmod +x scripts/build_swiss.sh
          bash scripts/build_swiss.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project NotesApp.xcodeproj \
            -scheme NotesApp \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SPM"

      - name: Run unit tests (NotesAppTests only)
        env:
          UNIT_TEST_RESULT_BUNDLE: ${{ runner.temp }}/UnitTests.xcresult
          XCODE_LOG: ${{ runner.temp }}/xcodebuild-tests.log
        run: |
          set -eo pipefail
          LIB_DIR="$SWISS_LIB_DIR"
          SWISS_SIM_LIB="$LIB_DIR/libswe_sim.a"
          rm -rf "$UNIT_TEST_RESULT_BUNDLE"
          cp "$SWISS_SIM_LIB" "$LIB_DIR/libswe.a"
          xcodebuild \
            -scheme NotesApp \
            -project NotesApp.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:NotesAppTests \
            -enableCodeCoverage YES \
            -resultBundlePath "$UNIT_TEST_RESULT_BUNDLE" \
            LIBRARY_SEARCH_PATHS="$LIB_DIR" \
            OTHER_LDFLAGS="$SWISS_SIM_LIB" \
            test | tee "$XCODE_LOG"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        env:
          UNIT_TEST_RESULT_BUNDLE: ${{ runner.temp }}/UnitTests.xcresult
          XCODE_LOG: ${{ runner.temp }}/xcodebuild-tests.log
        with:
          name: ios-unit-tests-${{ github.run_id }}
          path: |
            ${{ env.UNIT_TEST_RESULT_BUNDLE }}
            ${{ env.XCODE_LOG }}
          if-no-files-found: warn
          retention-days: 7
