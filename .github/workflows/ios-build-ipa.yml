name: iOS IPA Build

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method (app-store, ad-hoc, development)"
        required: true
        default: "ad-hoc"

jobs:
  build-ipa:
    runs-on: macos-latest
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      EXPORT_METHOD: ${{ inputs.export_method }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate App Icons (blue-white star)
        run: |
          chmod +x scripts/generate_app_icon.swift
          swift scripts/generate_app_icon.swift

      - name: Build Swiss Ephemeris (Moshier)
        run: |
          set -euo pipefail
          mkdir -p ThirdParty/SwissEph/include ThirdParty/SwissEph/lib
          TMP="$RUNNER_TEMP/swe"
          mkdir -p "$TMP" && cd "$TMP"
          URL1="https://github.com/aloistr/swisseph/archive/refs/tags/v2.10.03.tar.gz"
          URL2="https://github.com/aloistr/swisseph/archive/refs/tags/v2.10.02.tar.gz"
          echo "Downloading Swiss Ephemeris sources..."
          (curl -L "$URL1" -o swe.tgz || curl -L "$URL2" -o swe.tgz)
          tar -xzf swe.tgz
          ROOT=$(tar -tzf swe.tgz | head -1 | sed 's#/.*##')
          # Locate header to determine actual src dir
          HDR=$(tar -tzf swe.tgz | grep -E '/swephexp\.h$' | head -1 || true)
          if [ -z "$HDR" ]; then
            echo "Could not locate swephexp.h in archive"; ls -la; exit 1
          fi
          SRC="$TMP/${HDR%/*}"
          echo "Using source dir (by header): $SRC"; ls -la "$SRC" || true
          mkdir -p build && cd build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC="$(xcrun --sdk iphoneos -f clang)"
          CFLAGS="-arch arm64 -isysroot $SDK -O2 -fembed-bitcode -I$SRC"
          objs=()
          echo "Compiling *.c"
          for c in "$SRC"/*.c; do
            o=$(basename "$c" .c).o
            echo "Compiling $(basename "$c")"
            "$CC" $CFLAGS -c "$c" -o "$o"
            objs+=("$o")
          done
          echo "Creating static library libswe.a"
          libtool -static -o libswe.a "${objs[@]}"
          cp libswe.a "$GITHUB_WORKSPACE/ThirdParty/SwissEph/lib/"
          # Install headers
          cp "$TMP/$SRC"/*.h "$GITHUB_WORKSPACE/ThirdParty/SwissEph/include/"

      - name: Import signing certificate
        if: env.P12_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ env.P12_BASE64 }}
          p12-password: ${{ env.P12_PASSWORD }}

      - name: Install provisioning profile
        if: env.PROVISIONING_PROFILE_BASE64 != ''
        run: |
          set -e
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_PATH=~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          security cms -D -i "$PP_PATH" > $RUNNER_TEMP/profile.plist
          PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' $RUNNER_TEMP/profile.plist)
          PP_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' $RUNNER_TEMP/profile.plist)
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' $RUNNER_TEMP/profile.plist)
          BUNDLE_ID=${APPID#*.}
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          echo "Using provisioning profile: $PP_NAME ($PP_UUID) for $BUNDLE_ID"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies -project NotesApp.xcodeproj -scheme NotesApp -clonedSourcePackagesDirPath "$RUNNER_TEMP/SPM"

      - name: Archive (Release, unsigned)
        run: |
          xcodebuild archive \
            -project NotesApp.xcodeproj \
            -scheme NotesApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM=""

      - name: Create ExportOptions.plist (manual signing)
        run: |
          METHOD=${EXPORT_METHOD}
          TEAM=${IOS_TEAM_ID}
          BUNDLE=${BUNDLE_ID}
          PROFILE=${PP_NAME:-$PP_UUID}
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>teamID</key>
            <string>${TEAM}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE}</key>
              <string>${PROFILE}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
