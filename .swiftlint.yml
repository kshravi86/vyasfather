included:
  - NotesApp
  - NotesAppTests
  - NotesAppUITests

excluded:
  - NotesApp/SwissEph
  - ThirdParty
  - fastlane
  - docs
  - scripts
  - artifacts
  - iOS-Screenshots-5

analyzer_rules:
  - unused_declaration
  - unused_import

disabled_rules:
  - trailing_semicolon
  - force_cast
  - todo

opt_in_rules:
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - implicit_return
  - literal_expression_end_indentation
  - modifier_order
  - nimble_operator
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - strict_fileprivate
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces

line_length:
  warning: 110
  error: 130

type_body_length:
  warning: 280
  error: 400

function_body_length:
  warning: 80
  error: 120

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length: 3
  allowed_symbols: ["_"]
  validates_start_with_lowercase: true
  excluded:
    - id
    - ml
    - kg
    - deg
    - min
    - x
    - y
    - df

type_name:
  min_length: 3

trailing_whitespace:
  ignores_empty_lines: false

reporter: xcode
